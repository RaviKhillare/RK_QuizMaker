<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK QuizMaker - Web Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .player-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div id="quiz-host"></div>
  </div>

  <script src="embed.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var quizId = params.get('quizId') || params.get('id') || 'quiz_maha_gk';

      // Check if quiz data passed via URL hash
      if (window.location.hash && window.location.hash.indexOf('#quiz=') === 0) {
        try {
          var jsonStr = decodeURIComponent(window.location.hash.substring(6));
          var qObj = JSON.parse(jsonStr);
          if (qObj && qObj.id) {
            RKQuiz.register(qObj);
            quizId = qObj.id;
          }
        } catch(e) {}
      }

      var host = document.getElementById('quiz-host');
      host.setAttribute('data-rk-quiz', quizId);

      if (window.RKQuiz) {
        RKQuiz.init();
      }
    })();
  </script>
</body>
</html>
