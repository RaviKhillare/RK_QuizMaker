<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 0;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 260px;
            background: white;
            padding: 24px;
            text-align: center;
        }

        h3 {
            margin: 0 0 20px 0;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        input:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            font-weight: 500;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #e53935;
            margin-top: 15px;
            font-size: 12px;
            background: #ffebee;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Admin Login</h3>
        <input type="password" id="password" placeholder="Password" onkeyup="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()" id="btn-login">Unlock</button>
        <div id="result" class="error"></div>
    </div>

    <script>
        function checkPassword() {
            var pass = document.getElementById('password').value;
            var btn = document.getElementById('btn-login');
            var res = document.getElementById('result');

            btn.disabled = true;
            btn.textContent = 'Verifying...';
            res.style.display = 'none';

            google.script.run
                .withSuccessHandler(function (isValid) {
                    if (isValid) {
                        google.script.run.showAdminPanel();
                        setTimeout(function () { google.script.host.close(); }, 500); // Close auth after a brief delay
                    } else {
                        res.textContent = 'Incorrect Password';
                        res.style.display = 'block';
                        btn.disabled = false;
                        btn.textContent = 'Unlock';
                    }
                })
                .withFailureHandler(function (err) {
                    res.textContent = 'Error: ' + err.message;
                    res.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Unlock';
                })
                .checkAdminPassword(pass);
        }
    </script>
</body>

</html>
